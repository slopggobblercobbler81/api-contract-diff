[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "api-contract-diff"
version = "1.0.0"
description = "A fast developer CLI and library to compare OpenAPI/Swagger v2/v3 specifications and detect breaking changes."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "slopggobblercobbler81" }
]
keywords = [
    "openapi",
    "swagger",
    "api",
    "contract-testing",
    "diff",
    "breaking-changes",
    "api-versioning",
    "cli"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Internet :: WWW/HTTP",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "PyYAML>=6.0",
]

[project.scripts]
api-contract-diff = "api_contract_diff.cli:main"
contract-diff = "api_contract_diff.cli:main"

[project.urls]
Homepage = "https://github.com/slopggobblercobbler81/api-contract-diff"
Repository = "https://github.com/slopggobblercobbler81/api-contract-diff.git"
Issues = "https://github.com/slopggobblercobbler81/api-contract-diff/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
